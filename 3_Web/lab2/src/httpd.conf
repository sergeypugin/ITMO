# Конфигурация личного экземпляра Apache httpd
#
# Директивы Apache записываются по одной на строку

ServerRoot "/usr/local"

# Файлы и каталоги личного экземпляра Apache
Mutex default:/home/studs/s365809/httpd-root/mutex-dir/
PidFile "/home/studs/s365809/httpd-root/httpd.pid"
ErrorLog "/home/studs/s365809/httpd-root/error.log"
LogLevel warn

# Порт Apache; проверьте его доступность
Listen 10714
ServerName helios.cs.ifmo.ru:10714
ServerAdmin s365809@niuitmo.ru

# Модули, необходимые для статики и FastCGI
LoadModule unixd_module libexec/apache24/mod_unixd.so
LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule alias_module libexec/apache24/mod_alias.so
LoadModule fastcgi_module libexec/apache24/mod_fastcgi.so

# Таблица MIME-типов для CSS и JavaScript
TypesConfig etc/apache24/mime.types

<IfModule unixd_module>
    User www
    Group www
</IfModule>

# Доступ к файловой системе закрыт по умолчанию
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Статические файлы сайта
DocumentRoot "/home/studs/s365809/httpd-root/htdocs"
<Directory "/home/studs/s365809/httpd-root/htdocs">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Общие стили и ресурсы опубликованы в public_html/web/common.
# htdocs/common ведёт на эту папку символической ссылкой.
<Directory "/home/studs/s365809/public_html/web/common">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog "/home/studs/s365809/httpd-root/access.log" common
</IfModule>

# Передача динамических запросов в Java FastCGI
#
# Запросы к /fcgi-bin/lab2-server.jar передаются процессу на 127.0.0.1:10715
# Явный IPv4-адрес вместо localhost исключает попытку подключения к ::1
# Флаг -nph оставляет формирование полного HTTP-ответа за FastCGI-сервером
FastCgiExternalServer "/home/studs/s365809/httpd-root/fcgi-bin/lab2-server.jar" -host 127.0.0.1:10715 -nph

Alias /fcgi-bin/ "/home/studs/s365809/httpd-root/fcgi-bin/"
<Directory "/home/studs/s365809/httpd-root/fcgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>
