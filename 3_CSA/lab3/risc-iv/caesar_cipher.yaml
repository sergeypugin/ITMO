# Execution limits
limit: 1000 # Maximum instructions to execute
memory_size: 4096 # Memory size in bytes, equals 0x1000

# I/O configuration
memory_mapped_io:
  0x80: ["-3\nKhoor\n"] # Input values at address 0x80
  0x84: [] # Output-only port at address 0x84

# Reports configuration
reports:
  - name: "Test verification"
    slice: last
    view: |
      io[0x80]: {io:0x80:sym}
      io[0x84]: {io:0x84:sym}
    assert: |
      io[0x80]: "" >>> ""
      io[0x84]: "" >>> "Hello"
