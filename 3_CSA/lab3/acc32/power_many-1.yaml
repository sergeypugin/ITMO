# Execution limits
limit: 1000 # Maximum instructions to execute
memory_size: 4096 # Memory size in bytes, equals 0x1000

# I/O configuration
memory_mapped_io:
  0x80: [2, 2, 10, 3, 5] # Input values at address 0x80
  0x84: [] # Output-only port at address 0x84

# Reports configuration
reports:
  - name: "Test verification"
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [1024,243]
